name: update-cask

# Keeps Casks/nerder.rb on the latest lalloni/nerder release: version and checksum.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/lalloni/nerder/releases/latest --jq .tag_name 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "No release yet."; exit 0; fi
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/nerder.rb)
          if [ "$version" = "$current" ] && ! grep -q 'sha256 "0\{64\}"' Casks/nerder.rb; then
            echo "Already on $version."; exit 0
          fi
          curl -fsSL -o nerder.zip "https://github.com/lalloni/nerder/releases/download/$tag/nerder-macos-universal.zip"
          sha=$(sha256sum nerder.zip | cut -d' ' -f1)
          sed -i -e "s/^  version \".*\"$/  version \"$version\"/" \
                 -e "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$sha\"/" Casks/nerder.rb
          sed -i '/Placeholder until the first release/d' Casks/nerder.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nerder.rb
          git commit -m "chore: update nerder to $version"
          git push
